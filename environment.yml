name: adore
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - python=3.12
  - pip
  - numpy<2
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - joblib
  - networkx
  - pytz
  - tqdm
  - jupyter
  - ipykernel
  - smt
  - pytorch
  - pip:
      - assign_enc @ git+https://github.com/jbussemaker/AssignmentEncoding#egg=assign_enc
      - sb_arch_opt[arch_sbo,rocket]
      - open_turb_arch @ git+https://github.com/jbussemaker/OpenTurbofanArchitecting@pymoo_optional#egg=open_turb_arch
      - ./adore-2.0.0-py3-none-any.whl
      - torch_geometric
      - -e .
